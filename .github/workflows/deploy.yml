name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        # Same action version as working portfolio workflow
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Do not pass host_key: a bad VPS_KNOWN_HOSTS makes SSH fail in seconds.
          # Portfolio deploy works without host_key.
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="/var/www/cleaning-svetlana"
            BRANCH="main"

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ ! -f .env ]; then
              echo "ERROR: missing $APP_DIR/.env"
              exit 1
            fi

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            # App needs a few seconds after recreate before /health answers
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:3000/health"; then
                echo
                echo "Deploy OK"
                exit 0
              fi
              echo "health not ready yet ($i/30), waiting..."
              sleep 2
            done
            echo "ERROR: /health did not become ready"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 web
            exit 1

