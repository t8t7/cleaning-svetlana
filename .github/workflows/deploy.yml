name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          host_key: ${{ secrets.VPS_KNOWN_HOSTS }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export APP_DIR="/var/www/cleaning-svetlana"
            export REPO_URL="https://github.com/t8t7/cleaning-svetlana.git"
            export BRANCH="main"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d .git ]; then
              if [ -n "$(ls -A . 2>/dev/null | grep -v '^\.env$' || true)" ]; then
                echo "ERROR: $APP_DIR is not empty and has no .git"
                exit 1
              fi
              git clone --branch "$BRANCH" "$REPO_URL" .
            else
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            if [ ! -f .env ]; then
              echo "ERROR: create $APP_DIR/.env before deploy"
              exit 1
            fi

            chmod +x scripts/deploy.sh scripts/vps-install-docker-caddy.sh
            # Prefer compose directly so deploy works even if deploy.sh line endings differ
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            curl -fsS "http://127.0.0.1:3000/health"
            echo "Deploy OK"
